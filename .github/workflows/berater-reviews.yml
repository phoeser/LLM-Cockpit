name: Berater Google Reviews (woechentlich)

on:
  schedule:
    # Sonntags 05:00 UTC — neueste Google-Reviews der Berater-Stichprobe (reviews_sort=newest, deutsch)
    - cron: '0 5 * * 0'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google Places Reviews abrufen
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/fetch_berater_reviews.py

      - name: Marken-Hauptprofile Reviews abrufen (alle 10 Anbieter)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/fetch_brand_reviews.py
        continue-on-error: true

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/berater_reviews.json 2>/dev/null || true
          git add data/brand_reviews.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: berater google reviews (einmalig)"
          git pull --rebase origin main || true
          git push origin main
