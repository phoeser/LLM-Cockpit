name: Berater Google Reviews (woechentlich)

on:
  schedule:
    # Sonntags 05:00 UTC — neueste Google-Reviews der Berater-Stichprobe (reviews_sort=newest, deutsch)
    - cron: '0 5 * * 0'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

# Review-Fix 2026-06-12: explizite Schreibrechte (fehlte als einziger
# schreibender Workflow — bei restriktivem Repo-Default schlaegt der Push fehl)
permissions:
  contents: write

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google Places Reviews abrufen
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/fetch_berater_reviews.py

      - name: Marken-Hauptprofile Reviews abrufen (alle 10 Anbieter)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/fetch_brand_reviews.py
        continue-on-error: true

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/berater_reviews.json 2>/dev/null || true
          git add data/brand_reviews.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Datenaenderungen."; exit 0; fi
          git commit -m "data: berater google reviews"
          # Review-Fix 2026-06-12: Push-Retry wie im Nightly (vorher nackter Push)
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort 2>/dev/null || true
            if git push origin main; then echo "Push OK (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, Versuch $i"; sleep 10
          done
          echo "FEHLER: Push nach 3 Versuchen gescheitert"; exit 1
