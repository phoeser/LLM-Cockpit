name: Monatlicher URL-Crawl (Anbieter-Sitemaps)

on:
  schedule:
    # Review-Fix 2026-06-12: 06:45 UTC statt 04:30 — gestaffelt gegen Nightly
    # (04:30) und Weekly-Prices (05:45), da "repo-writes" nur 1 Pending-Slot hat.
    - cron: '45 6 1 * *'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright installieren (Browser-Fallback gegen Bot-Erkennung, z.B. Allianz)
        run: |
          pip install playwright
          playwright install chromium --with-deps
        continue-on-error: true

      - name: Anbieter-Sitemaps crawlen
        run: python scripts/crawl_provider_sitemaps.py
        continue-on-error: true

      - name: providers.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/providers.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: monatlicher URL-Crawl (Anbieter-Sitemaps)"
          git pull --rebase origin main || true
          git push origin main
