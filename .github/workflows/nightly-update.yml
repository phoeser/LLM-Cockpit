name: Nightly Dashboard Update

on:
  schedule:
    # 04:30 UTC (06:30 MESZ) — NACH dem GEO-Workflow (03:00 UTC), damit
    # Snapshot/SoV/Korrelation mit den GEO-Daten von HEUTE rechnen
    # (Review-Fix 2026-06-04: vorher 01:00 -> 22h alte GEO-Daten).
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  # Review-Fix 2026-06-04: gemeinsame Gruppe fuer ALLE Workflows, die auf main
  # committen -> serielle Ausfuehrung statt Push-Races
  group: repo-writes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout LLM-Cockpit-Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright fuer Trustpilot-Fallback
        run: |
          pip install playwright
          playwright install chromium --with-deps
        continue-on-error: true

      - name: Lade aktuellsten GEO-Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GEO_REPRO_TOKEN }}
          GEO_REPO: phoeser/geo-visibility-tool
        run: python scripts/update_snapshot.py
        # Review-Fix 2026-06-12: war der einzige Crawler-Step ohne
        # continue-on-error — ein GEO-API-Ausfall killte den ganzen Nightly
        # (kompletter Daten-Lueckentag). Snapshot bleibt dann auf dem Vortag.
        continue-on-error: true

      - name: Aktualisiere Sentiment-Daten (4 Quellen)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_sentiment.py

      - name: Aktualisiere Presse-Daten (Google News RSS)
        run: python scripts/update_press.py
        continue-on-error: true

      - name: v3 - Dashboard-fertige JSONs exportieren (sentiment + presse)
        run: python scripts/export_v3_json.py
        continue-on-error: true

      - name: Aktualisiere Domain-Footprint (Subdomain-Crawl)
        run: python scripts/update_domain_footprint.py
        continue-on-error: true

      - name: GEO Page-Events importieren (Seiten-Aenderungen)
        env:
          GITHUB_TOKEN: ${{ secrets.GEO_REPRO_TOKEN }}
          GEO_REPO: phoeser/geo-visibility-tool
        run: python scripts/merge_geo_page_events.py
        continue-on-error: true

      - name: Externe Ratings aktualisieren (Finanztip + manuelle Quellen)
        run: python scripts/update_ratings.py
        continue-on-error: true

      - name: Preisvergleich crawlen (Check24, 3 Produkte x 3 Altersprofile)
        run: python scripts/update_prices.py
        continue-on-error: true

      - name: Treiber-Tracker (Wikipedia, Check24-Rang, Testsieger-Status)
        run: python scripts/track_drivers.py
        continue-on-error: true

      - name: Korrelations-Engine Smoke-/Placebo-Test (Review-Fix 2026-06-12)
        run: python scripts/test_correlation_smoke.py
        continue-on-error: true

      - name: SoV-Historie aufzeichnen + Korrelations-/Impact-Analyse
        run: |
          python scripts/sov_history.py
          python scripts/correlation_impact.py
        continue-on-error: true

      - name: Daten-Dateien zurueck in main committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Alle Daten-Dateien + .previous.json fuer Event-Vergleiche committen
          git add data/review_history.json 2>/dev/null || true
          git add data/press_history.json 2>/dev/null || true
          git add data/sentiment_data.json 2>/dev/null || true
          git add data/sentiment_data.previous.json 2>/dev/null || true
          git add data/press_data.json 2>/dev/null || true
          git add data/press_data.previous.json 2>/dev/null || true
          git add data/geo_snapshot.json 2>/dev/null || true
          git add data/geo_snapshot.previous.json 2>/dev/null || true
          git add data/sentiment_dashboard.json 2>/dev/null || true
          git add data/press_dashboard.json 2>/dev/null || true
          git add domain_footprint_data.json 2>/dev/null || true
          git add domain_footprint_data.previous.json 2>/dev/null || true
          git add shared/events.jsonl 2>/dev/null || true
          git add data/geo_page_changes.json 2>/dev/null || true
          git add data/ratings_external.json 2>/dev/null || true
          git add data/price_comparison.json 2>/dev/null || true
          git add data/sov_history.jsonl 2>/dev/null || true
          git add data/correlation_impact.json 2>/dev/null || true
          git add data/driver_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Datenaenderungen."; exit 0; fi
          git commit -m "data: nightly update (alle Daten + Events)"
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort 2>/dev/null || true
            if git push origin main; then echo "Push OK (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, Versuch $i"; sleep 10
          done
          echo "FEHLER: Push nach 3 Versuchen gescheitert"; exit 1

      - name: Build und Deploy
        uses: ./.github/actions/build-and-deploy
        with:
          dashboard-password: ${{ secrets.DASHBOARD_PASSWORD }}
          commit-message: "chore: nightly dashboard update"
