name: Nightly Dashboard Update

on:
  schedule:
    # 04:30 UTC (06:30 MESZ) — NACH dem GEO-Workflow (03:00 UTC), damit
    # Snapshot/SoV/Korrelation mit den GEO-Daten von HEUTE rechnen
    # (Review-Fix 2026-06-04: vorher 01:00 -> 22h alte GEO-Daten).
    # 05.08.2026 von 04:30 auf 05:30 UTC verschoben: Der GEO-Crawl braucht
    # inzwischen 4,0-4,5 h (frueher 2,0-2,7 h), startet 23:10 und hat seine
    # Daten am 05.08. erst um 04:44 gepusht - der Nightly lief da schon 14 min
    # und arbeitete auf dem GEO-Stand vom Vortag. Lauf #475 hat daraufhin gar
    # nichts committet. Achtung: GitHub verzoegert geplante Jobs im Free-Tier
    # typisch um Stunden - die Verschiebung macht die Reihenfolge wahrschein-
    # licher, nicht sicher. Der robuste Weg waere, dass der GEO-Lauf den
    # Nightly am Ende selbst anstoesst (wie der Montags-Peec-Task, CLAUDE.md 3c).
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout LLM-Cockpit-Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright fuer Trustpilot-Fallback
        run: |
          pip install playwright
          playwright install chromium --with-deps
        continue-on-error: true

      - name: Lade aktuellsten GEO-Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GEO_REPRO_TOKEN }}
          GEO_REPO: phoeser/geo-visibility-tool
        run: python scripts/update_snapshot.py

      - name: Level-Zellen archivieren (Marke x Thema, fuer gepooltes Preis-Levelmodell)
        run: python scripts/archive_level_cells.py
        continue-on-error: true

      - name: Aktualisiere Sentiment-Daten (4 Quellen)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_sentiment.py

      - name: Aktualisiere Presse-Daten (Google News RSS)
        run: python scripts/update_press.py
        continue-on-error: true

      - name: v3 - Dashboard-fertige JSONs exportieren (sentiment + presse)
        run: python scripts/export_v3_json.py
        continue-on-error: true

      - name: Aktualisiere Domain-Footprint (Subdomain-Crawl)
        run: python scripts/update_domain_footprint.py
        continue-on-error: true

      - name: GEO Page-Events importieren (Seiten-Aenderungen)
        env:
          GITHUB_TOKEN: ${{ secrets.GEO_REPRO_TOKEN }}
          GEO_REPO: phoeser/geo-visibility-tool
        run: python scripts/merge_geo_page_events.py

      - name: Websuche-A/B aus dem GEO-Repo holen (Aggregate, ohne Rohantworten)
        env:
          GITHUB_TOKEN: ${{ secrets.GEO_REPRO_TOKEN }}
          GEO_REPO: phoeser/geo-visibility-tool
        run: python scripts/fetch_search_ab.py
        continue-on-error: true

      - name: Externe Ratings aktualisieren (Finanztip + manuelle Quellen)
        run: python scripts/update_ratings.py
        continue-on-error: true

      # 10.08.2026 ENTFERNT: "Preisvergleich crawlen" lief hier TAEGLICH - und
      # zusaetzlich jeden Montag in weekly-prices.yml. Beide riefen dasselbe
      # scripts/update_prices.py.
      #
      # Warum das schaedlich war: Versicherungstarife aendern sich ein- bis zweimal
      # im Jahr. Nachgerechnet ueber die Git-Historie von price_comparison.json
      # aendern sich an den meisten Tagen NULL von rund 230 Zellen. Was sich sehr
      # wohl aenderte, war die Zusammensetzung: je Lauf tauchten 3 bis 14 % der
      # Zellen neu auf oder verschwanden, weil der Crawl mal mehr und mal weniger
      # Anbieter greift. Das Modell sah diese Fluktuation als Preisbewegung - und
      # der Artefaktfilter in correlation_impact.py raeumte sie korrekt wieder weg:
      # "nach Artefaktfilter zu wenige Preisereignisse (n=1 von 22, noetig sind 5)".
      # Taeglich zu messen hat also nicht mehr Signal erzeugt, sondern nur mehr
      # Rauschen, das das wenige Signal ueberdeckt.
      #
      # Der Crawl laeuft weiterhin woechentlich (weekly-prices.yml, Mo 05:45 UTC)
      # und im Oktober/November zusaetzlich taeglich - dann bewegen sich die Preise
      # wegen der Kfz-Wechselsaison (Stichtag 30.11.) wirklich.
      #
      # archive_price_cells.py bleibt hier: es schreibt die Zeitreihe aus dem
      # vorhandenen Stand fort und ist idempotent je (Tag, Marke, Produkt) - es
      # crawlt nichts.

      - name: Preis-Zeitreihe archivieren (Relativpreis je Marke x Produkt)
        run: python scripts/archive_price_cells.py
        continue-on-error: true

      - name: Treiber-Tracker (Wikipedia, Check24-Rang, Testsieger-Status)
        run: python scripts/track_drivers.py
        continue-on-error: true

      - name: SoV-Historie aufzeichnen + Korrelations-/Impact-Analyse
        run: |
          python scripts/sov_history.py
          python scripts/correlation_impact.py
          python scripts/intervention_analysis.py
          python scripts/content_citations.py
        continue-on-error: true

      - name: Pipeline-Health schreiben (Frische je Daten-Element)
        run: python scripts/pipeline_health.py --write
        continue-on-error: true

      # Muss NACH der Korrelationsanalyse und dem Pipeline-Health laufen: das
      # Faktenblatt liest deren Ergebnisse. Kein continue-on-error - wenn das
      # Faktenblatt nicht entsteht, soll das auffallen, statt still zu einer
      # veralteten Wissensbasis zu fuehren.
      - name: Faktenblatt fuer GEOrg erzeugen
        run: python scripts/geo_faktenblatt.py

      - name: Daten-Dateien zurueck in main committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Alle Daten-Dateien + .previous.json fuer Event-Vergleiche committen
          git add data/review_history.json 2>/dev/null || true
          git add data/press_history.json 2>/dev/null || true
          git add data/sentiment_data.json 2>/dev/null || true
          git add data/sentiment_data.previous.json 2>/dev/null || true
          git add data/press_data.json 2>/dev/null || true
          git add data/press_data.previous.json 2>/dev/null || true
          git add data/geo_snapshot.json 2>/dev/null || true
          git add data/geo_snapshot.previous.json 2>/dev/null || true
          git add data/sentiment_dashboard.json 2>/dev/null || true
          git add data/press_dashboard.json 2>/dev/null || true
          git add domain_footprint_data.json 2>/dev/null || true
          git add domain_footprint_data.previous.json 2>/dev/null || true
          git add shared/events.jsonl 2>/dev/null || true
          git add data/page_dates.json 2>/dev/null || true
          git add data/geo_page_changes.json 2>/dev/null || true
          git add data/ratings_external.json 2>/dev/null || true
          git add data/price_comparison.json 2>/dev/null || true
          git add data/press_history.json 2>/dev/null || true
          git add data/sov_history.jsonl 2>/dev/null || true
          git add data/level_cells_history.jsonl 2>/dev/null || true
          git add data/price_history.jsonl 2>/dev/null || true
          git add data/correlation_impact.json 2>/dev/null || true
          git add data/content_citations.json 2>/dev/null || true
          git add data/search_ab.json 2>/dev/null || true
          git add data/press_url_cache.json 2>/dev/null || true
          git add data/driver_state.json 2>/dev/null || true
          git add data/pipeline_health.json 2>/dev/null || true
          git add data/intervention_results.json 2>/dev/null || true
          git add data/interventions.json 2>/dev/null || true
          git add data/geo_faktenblatt.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Datenaenderungen."; exit 0; fi
          git commit -m "data: nightly update (alle Daten + Events)"
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort 2>/dev/null || true
            if git push origin main; then echo "Push OK (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, Versuch $i"; sleep 10
          done
          echo "FEHLER: Push nach 3 Versuchen gescheitert"; exit 1

      # Nach dem Commit: GEOrg bekommt das Faktenblatt von heute Nacht. Ohne
      # gesetzte Secrets tut der Schritt nichts und endet gruen - so laeuft der
      # Nightly unveraendert weiter, bis der Agent tatsaechlich eingerichtet ist.
      - name: GEOrg-Wissensbasis aktualisieren (still, wenn nicht eingerichtet)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEORG_AGENT_ID: ${{ secrets.GEORG_AGENT_ID }}
        run: python scripts/georg_sync.py
        continue-on-error: true

      - name: Build und Deploy
        uses: ./.github/actions/build-and-deploy
        with:
          dashboard-password: ${{ secrets.DASHBOARD_PASSWORD }}
          commit-message: "chore: nightly dashboard update"

      - name: Frische-Alarm (Run wird ROT, wenn Daten veraltet sind)
        run: python scripts/pipeline_health.py --check
