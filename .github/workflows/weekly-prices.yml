name: Weekly Check24 Prices & Reviews

on:
  schedule:
    # Review-Fix 2026-06-12: 05:45 UTC statt 04:30 — exakt zeitgleicher Start
    # mit dem Nightly fuehrte in der Concurrency-Gruppe "repo-writes" dazu,
    # dass GitHub einen der Runs stillschweigend verwerfen kann (1 Pending-Slot).
    - cron: '45 5 * * 1'
    # 10.08.2026: Saisonfenster Kfz-Wechselsaison. Kuendigungsstichtag ist der
    # 30. November, die neuen Tarife greifen zum 1. Januar - Oktober und November
    # sind damit der einzige Zeitraum im Jahr, in dem sich viele Preise
    # gleichzeitig UND angekuendigt bewegen. Nur dort lohnt taegliches Messen;
    # den Rest des Jahres erzeugt es Rauschen (siehe Kommentar in
    # nightly-update.yml, wo der taegliche Lauf deshalb entfernt wurde).
    - cron: '45 5 * 10,11 *'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout LLM-Cockpit-Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Preisvergleich crawlen (7 Produkte x 3 Altersprofile)
        run: python scripts/update_prices.py
        continue-on-error: true

      # 10.08.2026: Die beiden Review-Schritte laufen NUR im Wochenlauf. Das
      # Saisonfenster (taeglich im Oktober/November) dient allein den Preisen -
      # Bewertungen taeglich zu crawlen kostet Gemini-Aufrufe und Laufzeit, ohne
      # dass sich dort etwas bewegt. 'is_wochenlauf' ist wahr am Montag und bei
      # jeder Handauslösung.
      - name: Wochenlauf oder Saisonfenster?
        id: modus
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "wochenlauf=true" >> "$GITHUB_OUTPUT"
            echo "Wochenlauf: Preise + Reviews"
          else
            echo "wochenlauf=false" >> "$GITHUB_OUTPUT"
            echo "Saisonfenster (Kfz-Wechselsaison): nur Preise"
          fi

      - name: Check24 Einzelbewertungen crawlen
        if: steps.modus.outputs.wochenlauf == 'true'
        env:
          CHECK24_REVIEWS_ENABLED: "1"
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_sentiment.py
        continue-on-error: true

      - name: Review-Themen-Clustering (Gemini)
        if: steps.modus.outputs.wochenlauf == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/review_themes.py
        continue-on-error: true

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_comparison.json 2>/dev/null || true
          git add data/review_history.json 2>/dev/null || true
          git add data/sentiment_data.json 2>/dev/null || true
          git add data/sentiment_data.previous.json 2>/dev/null || true
          git add shared/events.jsonl 2>/dev/null || true
          git add data/review_themes.json 2>/dev/null || true
          git add data/review_themes_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Aenderungen."; exit 0; fi
          git commit -m "data: Check24 update (${{ steps.modus.outputs.wochenlauf == 'true' && 'Preise + Reviews' || 'nur Preise, Saisonfenster' }})"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main || git rebase --abort 2>/dev/null || true
            if git push origin main; then echo "Push OK (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, Versuch $i"; sleep 10
          done
          echo "FEHLER: Push nach 3 Versuchen gescheitert"; exit 1
