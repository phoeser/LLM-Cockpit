name: Weekly Price Comparison

on:
  schedule:
    # Jeden Montag um 02:00 UTC (04:00 MESZ)
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-price-comparison
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LLM-Cockpit-Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Preisvergleich crawlen (Check24, 3 Produkte x 3 Altersprofile)
        run: python scripts/update_prices.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_comparison.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: woechentliches Preisvergleich-Update (Check24)"
          git pull --rebase origin main || true
          git push origin main
